<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#10243d" />
    <title>Quizzes</title>
    <meta
      name="description"
      content="Mathematics quizzes, LaTeX import, and results."
    />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./assets/app.css" />
    <script defer src="./js/math-config.js"></script>
    <script defer src="./assets/mathjax.js"></script>
    <script type="module" src="./js/library.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="shell"></div>
    <main class="main" id="main">
      <section class="page-heading">
        <div><h1>Quizzes</h1></div>
        <a class="button primary" href="./upload.html" data-author-only hidden
          ><span id="new-icon"></span>Upload quiz</a
        >
      </section>
      <section
        class="library-stats"
        id="library-stats"
        aria-label="Quiz overview"
      ></section>
      <section class="library-section">
        <div class="section-toolbar">
          <div class="filter-tabs" role="group" aria-label="Filter quizzes">
            <button class="active" data-filter="all">
              All <span id="all-count">0</span></button
            ><button data-filter="mine">On device</button
            ><button data-filter="published">Published</button
            ><button data-filter="uploads" id="my-uploads-tab" hidden>
              My uploads
            </button>
          </div>
          <label class="search-box"
            ><span id="search-icon"></span
            ><input
              id="search"
              type="search"
              placeholder="Search quizzes"
              aria-label="Search quizzes"
            /><kbd>/</kbd></label
          >
        </div>
        <div class="section-caption">
          <span id="quiz-count">Loading quizzes…</span>
          <div class="caption-actions">
            <button class="text-button" id="refresh-quizzes">Refresh</button
            ><button class="text-button" id="import-json">Import file ↑</button>
          </div>
        </div>
        <div
          id="cloud-catalog-feedback"
          style="margin-bottom: 14px"
          hidden
        ></div>
        <div class="quiz-grid" id="quiz-grid" aria-live="polite"></div>
        <div class="library-footer">
          <span id="footer-file"></span
          ><span>Import a .tex or .quiz.json file to add a quiz.</span
          ><a href="./examples/starter.tex" download>LaTeX example ↓</a>
        </div>
      </section>
    </main>
    <input type="file" accept=".json,application/json" id="json-file" hidden />
  </body>
</html>
